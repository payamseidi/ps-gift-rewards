name: Validate and Package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  php-js-lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find payamseidi-ps-gift-rewards -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax check
        run: |
          node --check payamseidi-ps-gift-rewards/assets/blocks.js
          node --check payamseidi-ps-gift-rewards/assets/gifts.js
      - name: Rule and Store API smoke tests
        run: |
          php tests/rules-smoke.php
          php tests/blocks-smoke.php
      - name: Package WordPress plugin
        run: zip -r ps-gift-rewards-0.3.0-alpha.1.zip payamseidi-ps-gift-rewards -x '*/.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: ps-gift-rewards-0.3.0-alpha.1
          path: ps-gift-rewards-0.3.0-alpha.1.zip
